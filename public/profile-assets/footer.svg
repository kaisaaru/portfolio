<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="140" role="img" aria-label="Footer - Kaisar Rayfa Al Baihaqqi">
  <title>Footer - Kaisar Rayfa Al Baihaqqi</title>
  <defs>
    <!-- Background Gradient (Matches Header) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090D1A" />
      <stop offset="100%" stop-color="#05070E" />
    </linearGradient>

    <!-- Border Gradient (Matches Header) -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Hairline Accent -->
    <linearGradient id="hairlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Rain Fade Mask -->
    <linearGradient id="rainMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" />
      <stop offset="30%" stop-color="#fff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#fff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="rainFade">
      <rect x="0" y="0" width="1200" height="140" fill="url(#rainMask)" />
    </mask>

    <!-- Subtle Glow Filter -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, "Fira Code", "Noto Sans JP", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .jp { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", monospace; font-weight: 500; }

    @keyframes matrixFall {
      0% { transform: translateY(-120px); }
      100% { transform: translateY(160px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
  </style>

  <!-- Container Frame -->
  <rect x="1" y="1" width="1198" height="138" rx="12" fill="url(#bgGrad)" stroke="url(#termBorder)" stroke-width="1.2" />

  <!-- Terminal Top Bar -->
  <rect x="1" y="1" width="1198" height="34" rx="12" fill="#0A0F1D" fill-opacity="0.9" />
  <!-- Corner flatteners for top bar -->
  <rect x="1" y="24" width="1198" height="11" fill="#0A0F1D" fill-opacity="0.9" />
  <line x1="1" y1="35" x2="1199" y2="35" stroke="#1E293B" stroke-width="1" />

  <!-- Terminal Window Controls (Header Match) -->
  <circle cx="28" cy="18" r="5" fill="#EF4444" fill-opacity="0.85" />
  <circle cx="45" cy="18" r="5" fill="#F59E0B" fill-opacity="0.85" />
  <circle cx="62" cy="18" r="5" fill="#10B981" fill-opacity="0.85" />

  <!-- Window Header Title -->
  <text x="82" y="22" fill="#475569" class="mono" font-size="11">bash - footer.sh // kaisaaru@system</text>

  <!-- Status Right Tag -->
  <g transform="translate(1060, 11)">
    <rect x="0" y="0" width="112" height="18" rx="9" fill="#0369A1" fill-opacity="0.2" stroke="#0284C7" stroke-width="0.8" />
    <circle cx="10" cy="9" r="3" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="12.5" fill="#38BDF8" class="mono" font-size="9.5" font-weight="600">#2030IslaNyata</text>
  </g>

  <!-- Matrix Rain Streams (Side Accents, masked) -->
  <g mask="url(#rainFade)" opacity="0.18">
    <!-- Left Rain Stream -->
    <g transform="translate(45, 0)" style="animation: matrixFall 6s linear infinite;">
      <text x="0" y="10" fill="#38BDF8" class="jp" font-size="10">形</text>
      <text x="0" y="25" fill="#38BDF8" class="mono" font-size="10">01</text>
      <text x="0" y="40" fill="#60A5FA" class="jp" font-size="10">創</text>
      <text x="0" y="55" fill="#38BDF8" class="mono" font-size="10">10</text>
      <text x="0" y="70" fill="#38BDF8" class="jp" font-size="10">進</text>
    </g>
    <g transform="translate(100, 0)" style="animation: matrixFall 8s linear infinite -3s;">
      <text x="0" y="15" fill="#60A5FA" class="mono" font-size="10">0101</text>
      <text x="0" y="32" fill="#38BDF8" class="jp" font-size="10">考</text>
      <text x="0" y="48" fill="#60A5FA" class="mono" font-size="10">1100</text>
    </g>

    <!-- Right Rain Stream -->
    <g transform="translate(1080, 0)" style="animation: matrixFall 7s linear infinite -2s;">
      <text x="0" y="12" fill="#38BDF8" class="mono" font-size="10">1001</text>
      <text x="0" y="28" fill="#60A5FA" class="jp" font-size="10">未</text>
      <text x="0" y="44" fill="#38BDF8" class="mono" font-size="10">0011</text>
      <text x="0" y="60" fill="#38BDF8" class="jp" font-size="10">来</text>
    </g>
    <g transform="translate(1135, 0)" style="animation: matrixFall 9s linear infinite -5s;">
      <text x="0" y="10" fill="#60A5FA" class="jp" font-size="10">夢</text>
      <text x="0" y="26" fill="#38BDF8" class="mono" font-size="10">2030</text>
      <text x="0" y="42" fill="#60A5FA" class="mono" font-size="10">0110</text>
    </g>
  </g>

  <!-- Center Content -->
  <!-- Audio/Frequency Bars Center-Top -->
  <g transform="translate(600, 52)">
    <line x1="-50" y1="0" x2="-50" y2="8" stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y2" values="4;12;3;9;4" dur="1.2s" repeatCount="indefinite" />
    </line>
    <line x1="-35" y1="0" x2="-35" y2="12" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y2" values="12;4;14;7;12" dur="1.5s" repeatCount="indefinite" />
    </line>
    <line x1="-20" y1="0" x2="-20" y2="15" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y2" values="15;6;16;8;15" dur="1.3s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y2" values="10;16;5;12;10" dur="1.1s" repeatCount="indefinite" />
    </line>
    <line x1="20" y1="0" x2="20" y2="14" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y2" values="14;8;17;9;14" dur="1.4s" repeatCount="indefinite" />
    </line>
    <line x1="35" y1="0" x2="35" y2="10" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y2" values="10;5;13;7;10" dur="1.2s" repeatCount="indefinite" />
    </line>
    <line x1="50" y1="0" x2="50" y2="6" stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y2" values="6;11;4;8;6" dur="1.3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Quote with Terminal Prompt & Blinking Cursor -->
  <g transform="translate(600, 84)">
    <text text-anchor="middle" class="mono" font-size="14.5" font-weight="500">
      <tspan fill="#38BDF8" font-weight="700">&gt; echo </tspan>
      <tspan fill="#E2E8F0">"Constantly learning, continuously evolving."</tspan>
      <tspan fill="#38BDF8" class="cursor-blink" font-weight="700"> _</tspan>
    </text>
  </g>

  <!-- Developer Identity & Location -->
  <g transform="translate(600, 114)">
    <text text-anchor="middle" class="mono" font-size="11.5">
      <tspan fill="#60A5FA" font-weight="700">KAISAR RAYFA AL BAIHAQQI</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#94A3B8">Software Developer</tspan>
      <tspan fill="#475569"> · </tspan>
      <!-- Vector Map Pin -->
      <tspan fill="#38BDF8">⚲ </tspan>
      <tspan fill="#94A3B8">Bandung, Indonesia</tspan>
    </text>
  </g>

  <!-- Bottom Hairline Glow -->
  <line x1="200" y1="139" x2="1000" y2="139" stroke="url(#hairlineGrad)" stroke-width="1" />
</svg>
